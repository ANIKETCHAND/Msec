services:
  - type: web
    name: medishield-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: "https://your-medishield-frontend.vercel.app"
      - key: SECRET_KEY
        generateValue: true
      - key: AES_GCM_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medishield-db
          property: connectionString

databases:
  - name: medishield-db
    plan: free
    region: oregon
